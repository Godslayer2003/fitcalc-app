services:
  - type: web
    name: fitcalc-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm ci && npx prisma generate && npx prisma db push --accept-data-loss && npm run build
    startCommand: npm start -- -p $PORT
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAILS
        value: ethan10038@gmail.com
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: WEB_ORIGIN
        sync: false
